name: Setup .Net
description: Set up .NET and MSBuild (on Windows), and optionally a private NuGet source on GitHub Packages

inputs:
  dotnet-version:
    description: Version of .Net to use
    required: true
  github-packages-username:
    description: Username to authenticate with GitHub Packages
    default: dgellow
    required: false
  github-packages-token:
    description: Token used to authenticate with GitHub Packages
    default: ""
    required: false
  github-packages-feed:
    description: GitHub Packages feed
    default: https://nuget.pkg.github.com/ElboraiSoftware/index.json
    required: false
  github-packages-source-name:
    description: GitHub Packages source name
    default: "Private Elborai Software NuGet feed"
    required: false
  os:
    description: Current runner operating system
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "${{ inputs.dotnet-version }}"

    - name: Setup MSBuild.exe
      if: inputs.os == 'Windows'
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Configure private NuGet package source
      shell: pwsh
      if: inputs.github-packages-token != ''
      run: |
        $ErrorActionPreference = 'Stop'
        dotnet nuget list source --format detailed
        if(!$?) { Exit $LASTEXITCODE }

        # First try to remove if the source is already added
        $feedUrl = $env:ACTION_FEED
        $sources = dotnet nuget list source
        if(!$?) { Exit $LASTEXITCODE }

        $sourceName = ""
        $sources -split "`n" | %{
            write-host $_
            if($_ -match '^\s+\d+\.\s+(.*)\s+\[Enabled\]$'){
                $sourceName = $matches[1]
                write-host "found match for source name: " $sourceName
            } elseif ($_ -match ("^\s+" + [regex]::Escape($feedUrl) + "$")) {
                write-host "found feed, will remove using source name: " $sourceName
                dotnet nuget remove source $sourceName
                if(!$?) { Exit $LASTEXITCODE }
            }
        }

        dotnet nuget list source --format detailed
        if(!$?) { Exit $LASTEXITCODE }

        # Then add the source
        dotnet nuget add source "$env:ACTION_FEED" --name "$env:ACTION_SOURCE_NAME" --username "$env:ACTION_USERNAME" --password "$env:ACTION_TOKEN" --store-password-in-clear-text
        if(!$?) { Exit $LASTEXITCODE }
      env:
        ACTION_FEED: ${{ inputs.github-packages-feed }}
        ACTION_SOURCE_NAME: ${{ inputs.github-packages-source-name }}
        ACTION_USERNAME: ${{ inputs.github-packages-username }}
        ACTION_TOKEN: ${{ inputs.github-packages-token }}
