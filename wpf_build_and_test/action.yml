name: WPF build and test
description: Build and test a WPF application

inputs:
  package-project-path:
    description: Path to the .wapproj file
    required: true
  package-project-dir:
    description: Directory containing the package project
    required: true
  test-project-path:
    description: Path to test project
    default: ""
  configuration:
    description: The .Net configuration to use for packing, Debug or Release
    default: Release
  target-platform:
    description: The platform to target
    default: x64
  save-to-github-artifact:
    description: If true the build will be saved to GitHub artifacts
    default: "false"
  pfx-certificate:
    description: Base64 encoded PFX certificate (expect certutil format)
    default: ""
  pfx-password:
    description: Password of the PFX certificate
    default: ""

runs:
  using: "composite"
  steps:
    - name: Decode certificate
      shell: pwsh
      if: inputs.pfx-certificate != ''
      env:
        ACTION_PFX_CERTIFICATE: ${{ inputs.pfx-certificate }}
      run: |
        $ErrorActionPreference = 'Stop'
        $env:ACTION_PFX_CERTIFICATE | Out-File -FilePath mycert.b64
        certutil -decode mycert.b64 mycert.pfx

    - name: Restore
      shell: pwsh
      env:
        ACTION_PROJECT: ${{ inputs.package-project-path }}
        ACTION_CONFIGURATION: ${{ inputs.configuration }}
        ACTION_PLATFORM: ${{ inputs.target-platform }}
      run: |
        msbuild "$env:ACTION_PROJECT" /t:Restore /p:Configuration="$env:ACTION_CONFIGURATION" /p:RuntimeIdentifier="win-$env:ACTION_PLATFORM"

    - name: Build for ${{ inputs.configuration }}
      shell: pwsh
      env:
        ACTION_PROJECT: ${{ inputs.package-project-path }}
        ACTION_CONFIGURATION: ${{ inputs.configuration }}
        ACTION_PLATFORM: ${{ inputs.target-platform }}
        ACTION_HAS_CERTIFICATE: ${{ inputs.pfx-certificate != '' }}
        ACTION_PFX_PASSWORD: ${{ inputs.pfx-password }}
      run: |
        $ErrorActionPreference = 'Stop'
        $buildArgs = @(
          "/p:Platform=$env:ACTION_PLATFORM"
          "/p:Configuration=$env:ACTION_CONFIGURATION"
          "/p:UapAppxPackageBuildMode=SideloadOnly"
          "/p:AppxBundle=Never"
        )
        if ($env:ACTION_HAS_CERTIFICATE -eq 'true') {
          $absolutePath = Resolve-Path .\mycert.pfx
          $buildArgs += "/p:PackageCertificateKeyFile=$absolutePath"
          $buildArgs += "/p:PackageCertificatePassword=$env:ACTION_PFX_PASSWORD"
          $buildArgs += "/p:AppxPackageSigningEnabled=True"
        }
        msbuild "$env:ACTION_PROJECT" $buildArgs

    - name: Test
      shell: pwsh
      if: inputs.test-project-path != ''
      env:
        ACTION_TEST_PROJECT: ${{ inputs.test-project-path }}
      run: |
        dotnet test "$env:ACTION_TEST_PROJECT"

    - name: Remove certificate files
      shell: pwsh
      if: inputs.pfx-certificate != ''
      run: |
        $ErrorActionPreference = 'Stop'
        Remove-Item -Path .\mycert.b64
        Remove-Item -Path .\mycert.pfx

    - name: Upload build to GitHub Artifacts
      if: fromJSON(inputs.save-to-github-artifact)
      uses: actions/upload-artifact@v7
      with:
        name: Build_${{ inputs.configuration }}_${{ inputs.target-platform }}
        path: ${{ inputs.package-project-dir }}\AppPackages\*
        if-no-files-found: error
